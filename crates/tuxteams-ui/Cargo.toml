[package]
name = "tuxteams-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
slint = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }

# Le code généré par Slint porte `#[allow(unsafe_code)]`, incompatible avec `forbid` :
# ce crate seul passe à `deny` (aucun `unsafe` écrit à la main). Le reste suit le workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
