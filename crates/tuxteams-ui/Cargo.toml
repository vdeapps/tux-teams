[package]
name = "tuxteams-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
slint = { workspace = true }
tuxteams-domaine = { workspace = true }
tuxteams-application = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# Le code généré par Slint porte `#[allow(unsafe_code)]`, incompatible avec `forbid` :
# ce crate seul passe à `deny` (aucun `unsafe` écrit à la main). Le reste suit le workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
